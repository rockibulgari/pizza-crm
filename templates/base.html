<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Пицца Назрань · CRM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('orders') }}">
      <span class="brand-logo">🍕</span>
      <span>Пицца Назрань <span class="brand-sub">CRM</span></span>
    </a>
    {% if g.staff %}
      <div class="topbar-right">
        {# Кнопки конкретной страницы, например звук на списке заказов #}
        {% block topbar_actions %}{% endblock %}
        <span class="who">
          <span class="who-name">{{ g.staff.name }}</span>
          <span class="who-role">{{ role_names[g.staff.role] }}</span>
        </span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link logout">Выйти</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
